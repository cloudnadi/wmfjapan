name: Import NPO Membership CSV

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - preview
          - production
        default: production
      ref:
        description: Git ref containing the CSV and import script
        required: false
        default: main
      csv_path:
        description: Repository-relative path to the membership CSV
        required: true
        default: npo_membership.csv
      dry_run:
        description: Validate the CSV without writing to DynamoDB
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
  TF_STATE_KEY_PREFIX: ${{ vars.TF_STATE_KEY_PREFIX || 'wmfjapan' }}
  TF_IN_AUTOMATION: true
  TERRAFORM_DIR: backend

concurrency:
  group: import-npo-membership-${{ inputs.environment }}

jobs:
  import-npo-membership:
    name: Import NPO membership to ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Validate CSV path
        env:
          CSV_PATH: ${{ inputs.csv_path }}
        run: |
          if [ ! -f "$CSV_PATH" ]; then
            echo "CSV file not found: $CSV_PATH"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

    #   - name: Configure AWS credentials via OIDC role
    #     if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
    #     uses: aws-actions/configure-aws-credentials@v6
    #     with:
    #       role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
    #       aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials via access keys
        if: ${{ env.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate Terraform state configuration
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "TF_STATE_BUCKET secret is required"
            exit 1
          fi

      - name: Initialize Terraform state
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=apps/${{ env.TF_STATE_KEY_PREFIX }}/${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Resolve NPO membership table
        id: terraform
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: echo "npo_membership_table=$(terraform output -raw npo_membership_table_name)" >> "$GITHUB_OUTPUT"

      - name: Install import dependencies
        run: python -m pip install --disable-pip-version-check boto3

      - name: Import NPO membership CSV
        env:
          CSV_PATH: ${{ inputs.csv_path }}
        run: |
          args=(
            --csv "$CSV_PATH"
            --table "${{ steps.terraform.outputs.npo_membership_table }}"
            --region "${{ env.AWS_REGION }}"
          )
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          python scripts/import_npo_membership.py "${args[@]}"
