<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WMF Japan Events</title>
    <meta name="description" content="Find and register for WMF Japan events. Sign in for member pricing, or register as a guest." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#151922" />
    <link rel="canonical" href="https://wmfevents.cloudnadi.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WMF Japan" />
    <meta property="og:title" content="WMF Japan Events" />
    <meta property="og:description" content="Find and register for WMF Japan events. Sign in for member pricing, or register as a guest." />
    <meta property="og:url" content="https://wmfevents.cloudnadi.com/" />
    <meta property="og:image" content="https://wmfevents.cloudnadi.com/logo.png" />
    <meta property="og:image:width" content="300" />
    <meta property="og:image:height" content="163" />
    <meta property="og:image:alt" content="WMF Japan logo" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="WMF Japan Events" />
    <meta name="twitter:description" content="Find and register for WMF Japan events. Sign in for member pricing, or register as a guest." />
    <meta name="twitter:image" content="https://wmfevents.cloudnadi.com/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" /></noscript>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "WMF Japan",
            "url": "https://wmfevents.cloudnadi.com/",
            "sameAs": ["https://www.wmfjapan.org/"],
            "logo": "https://wmfevents.cloudnadi.com/logo.png"
          },
          {
            "@type": "WebSite",
            "name": "WMF Japan",
            "url": "https://wmfevents.cloudnadi.com/"
          }
        ]
      }
    </script>
    <script>
      // Apply persisted theme before paint to avoid a flash (default: dark).
      (function () {
        try {
          var stored = localStorage.getItem("wmf-theme");
          document.documentElement.setAttribute(
            "data-theme",
            stored === "light" ? "light" : "dark"
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>  </body>
</html>
