<!--
  Placeholder for the event closure banner on the landing page.
  Replace it by dropping the real artwork into frontend/public and pointing
  EVENT_CLOSURE_IMAGE in src/App.jsx (or VITE_EVENT_CLOSURE_IMAGE) at the file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Event closure banner placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1710" />
      <stop offset="55%" stop-color="#2a2014" />
      <stop offset="100%" stop-color="#15120d" />
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd684" />
      <stop offset="100%" stop-color="#f5a623" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />
  <rect x="40" y="40" width="1520" height="820" rx="24" fill="none"
        stroke="#f5a623" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="14 12" />

  <circle cx="800" cy="330" r="86" fill="none" stroke="url(#amber)" stroke-width="4" />
  <path d="M762 332 l26 26 50 -54" fill="none" stroke="url(#amber)"
        stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

  <text x="800" y="520" text-anchor="middle" fill="#ffd684"
        font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="bold">
    Event Closure Image
  </text>
  <text x="800" y="596" text-anchor="middle" fill="#8d8275"
        font-family="Helvetica, Arial, sans-serif" font-size="30" letter-spacing="4">
    PLACEHOLDER — UPLOAD THE FINAL ARTWORK HERE
  </text>
</svg>
